name: Deploy ECS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Manual deploy: run prisma migrate deploy"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate:api

      - name: Run verification checks
        run: npm run ci:verify

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      DEPLOY_REF: ${{ github.sha }}
      RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deployment Summary
        run: |
          {
            echo "## Deployment plan"
            echo ""
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- Run migrations: \`${RUN_MIGRATIONS}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Build mode: GitHub Actions image build, ECS image load"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: wms-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save API image
        run: |
          docker save "wms-api:${DEPLOY_REF}" | gzip > "wms-api-${DEPLOY_REF}.tar.gz"
          ls -lh "wms-api-${DEPLOY_REF}.tar.gz"

      - name: Copy API image to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: wms-api-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Deploy to ECS by SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_REF,RUN_MIGRATIONS
          script: |
            set -eu
            JOB_START_TS="$(date +%s)"
            retry() {
              max_attempts="$1"
              shift
              attempt=1
              while true; do
                if "$@"; then
                  return 0
                fi
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "Command failed after ${attempt} attempts: $*"
                  return 1
                fi
                sleep_secs=$((attempt * 5))
                echo "Command failed (attempt ${attempt}/${max_attempts}). Retrying in ${sleep_secs}s: $*"
                sleep "${sleep_secs}"
                attempt=$((attempt + 1))
              done
            }
            timed() {
              label="$1"
              shift
              start_ts="$(date +%s)"
              echo ">>> [start] ${label}"
              "$@"
              end_ts="$(date +%s)"
              elapsed="$((end_ts - start_ts))"
              echo "<<< [done] ${label} (${elapsed}s)"
            }
            timed_retry() {
              label="$1"
              max_attempts="$2"
              shift 2
              start_ts="$(date +%s)"
              echo ">>> [start] ${label}"
              retry "${max_attempts}" "$@"
              end_ts="$(date +%s)"
              elapsed="$((end_ts - start_ts))"
              echo "<<< [done] ${label} (${elapsed}s)"
            }
            cd ~/wms
            timed "git_fetch" git fetch --all --prune
            timed "git_checkout_main" git checkout main
            timed "git_reset_deploy_ref" git reset --hard "${DEPLOY_REF}"
            DEPLOY_SESSION_VERSION="$(git rev-parse HEAD)"
            export DEPLOY_SESSION_VERSION
            echo "Using DEPLOY_SESSION_VERSION=${DEPLOY_SESSION_VERSION}"
            timed "git_show_head" git show -s --format="%H %s" HEAD
            timed "publish_company_site" sh -c "install -d -m 0755 /var/www/fulangke && find /var/www/fulangke -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && cp -a apps/company-site/. /var/www/fulangke/ && chmod -R a+rX /var/www/fulangke"
            if command -v nginx >/dev/null 2>&1 && [ -e /etc/nginx/sites-enabled/www.fulangke.cn ]; then
              timed "nginx_config_test" nginx -t
              timed "nginx_reload" systemctl reload nginx
            fi
            IMAGE_TAR="/tmp/wms-api-${DEPLOY_REF}.tar.gz"
            IMAGE_TAG="wms-api:${DEPLOY_REF}"
            if [ ! -s "${IMAGE_TAR}" ]; then
              echo "Missing deployment image tar: ${IMAGE_TAR}"
              exit 1
            fi
            timed "docker_load_api_image" sh -c "gzip -dc '${IMAGE_TAR}' | docker load"
            {
              printf '%s\n' 'services:'
              printf '%s\n' '  api:'
              printf '    image: %s\n' "${IMAGE_TAG}"
              printf '%s\n' '    build: null'
            } > /tmp/wms-api-image-compose.yml
            timed "show_api_image_compose" cat /tmp/wms-api-image-compose.yml
            timed "validate_api_image_compose" sh -c "docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml config >/tmp/wms-api-compose-config.yml"
            timed_retry "compose_up_db_redis" 3 docker compose up -d db redis
            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              echo "Running prisma migrate deploy..."
              timed_retry "prisma_migrate_deploy" 3 docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml run --rm --no-deps api npm run -w api prisma:migrate:deploy
            else
              echo "Skipping prisma migrate deploy."
            fi
            timed_retry "compose_up_api_recreate" 3 docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml up -d --force-recreate --remove-orphans api
            timed "compose_ps" docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml ps
            timed "api_logs_tail_120" sh -c "docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml logs --tail=120 api || true"
            echo "Smoke check static assets..."
            READY=0
            SMOKE_START_TS="$(date +%s)"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                READY=1
                echo "API is ready (attempt ${i})."
                break
              fi
              sleep 2
            done
            if [ "${READY}" -ne 1 ]; then
              echo "API readiness check timeout."
              docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml ps
              docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml logs --tail=200 api || true
              exit 1
            fi
            SMOKE_END_TS="$(date +%s)"
            echo "<<< [done] smoke_wait_ready ($((SMOKE_END_TS - SMOKE_START_TS))s)"
            timed "smoke_head_root" curl -fI http://127.0.0.1:3000/
            timed "smoke_head_app_js" curl -fI http://127.0.0.1:3000/app.js
            if [ -e /etc/nginx/sites-enabled/www.fulangke.cn ]; then
              timed "smoke_company_site" sh -c "curl -fsS -H 'Host: www.fulangke.cn' http://127.0.0.1/ | grep -q 'Fulangke WMS'"
              timed "smoke_privacy_policy" sh -c "curl -fsS -H 'Host: www.fulangke.cn' http://127.0.0.1/privacy/ | grep -q '隐私政策与数据处理说明'"
            fi
            timed "smoke_download_app_js" curl -fsS http://127.0.0.1:3000/app.js -o /tmp/wms_app.js
            timed "smoke_grep_marker" grep -q "normalizeErrorMessage" /tmp/wms_app.js
            timed "cleanup_image_tar" rm -f "${IMAGE_TAR}"
            timed "cleanup_old_wms_images" sh -c "docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v keep='${IMAGE_TAG}' '\$1 ~ /^wms-api:/ && \$1 != keep {print \$2}' | sort -u | xargs -r docker rmi || true"
            JOB_END_TS="$(date +%s)"
            echo "=== Deploy total elapsed: $((JOB_END_TS - JOB_START_TS))s ==="
            echo "Smoke check passed."
