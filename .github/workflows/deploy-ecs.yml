name: Deploy ECS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Manual deploy: run prisma migrate deploy"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate:api

      - name: Run verification checks
        run: npm run ci:verify

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 165
    environment:
      name: production
    env:
      DEPLOY_REF: ${{ github.sha }}
      DEPLOY_GITHUB_TOKEN: ${{ github.token }}
      RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'true' }}
      RAKUTEN_RMS_API_ENCRYPTION_KEY: ${{ secrets.RAKUTEN_RMS_API_ENCRYPTION_KEY }}
      RAKUTEN_RMS_API_PROXY_URL: http://rakuten-egress:1055
      RAKUTEN_RMS_EXIT_NODE_IP: 100.87.11.96
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deployment Summary
        run: |
          {
            echo "## Deployment plan"
            echo ""
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- Run migrations: \`${RUN_MIGRATIONS}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Build mode: GitHub Actions image build, ECS image load"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: wms-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save API image
        run: |
          docker save "wms-api:${DEPLOY_REF}" | gzip > "wms-api-${DEPLOY_REF}.tar.gz"
          ls -lh "wms-api-${DEPLOY_REF}.tar.gz"

      - name: Copy API image to ECS
        timeout-minutes: 110
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: bash scripts/wms-upload-image.sh "wms-api-${DEPLOY_REF}.tar.gz"

      - name: Deploy to ECS by SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          envs: DEPLOY_REF,DEPLOY_GITHUB_TOKEN,RUN_MIGRATIONS,RAKUTEN_RMS_API_ENCRYPTION_KEY,RAKUTEN_RMS_API_PROXY_URL,RAKUTEN_RMS_EXIT_NODE_IP
          script: |
            set -euo pipefail
            COMPANY_ROLLBACK_ENABLED=0
            rollback_company_release() {
              result=$?
              trap - EXIT
              if [ "$result" -ne 0 ] && [ "$COMPANY_ROLLBACK_ENABLED" = 1 ]; then
                echo "Company release failed; restoring the previous API image. The verified database backup is retained."
                # Older Prisma clients require non-null account/audit company IDs.
                # This compatibility rollback does not change stock or order ownership.
                if [ "${COMPANY_AFFILIATION_PENDING:-0}" = 1 ]; then
                  docker exec wms_db sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -uroot wms_v1 -e "UPDATE users SET company_id=1 WHERE company_id IS NULL; UPDATE operation_audit_logs SET company_id=1 WHERE company_id IS NULL;"' || true
                fi
                export DEPLOY_SESSION_VERSION="$OLD_API_DEPLOY_VERSION"
                docker compose -f docker-compose.yml -f /tmp/wms-api-rollback-compose.yml --profile rakuten-egress up -d --no-deps api || true
              fi
              exit "$result"
            }
            trap rollback_company_release EXIT
            JOB_START_TS="$(date +%s)"
            retry() {
              max_attempts="$1"
              shift
              attempt=1
              while true; do
                if "$@"; then
                  return 0
                fi
                if [ "${attempt}" -ge "${max_attempts}" ]; then
                  echo "Command failed after ${attempt} attempts: $*"
                  return 1
                fi
                sleep_secs=$((attempt * 5))
                echo "Command failed (attempt ${attempt}/${max_attempts}). Retrying in ${sleep_secs}s: $*"
                sleep "${sleep_secs}"
                attempt=$((attempt + 1))
              done
            }
            timed() {
              label="$1"
              shift
              start_ts="$(date +%s)"
              echo ">>> [start] ${label}"
              "$@"
              end_ts="$(date +%s)"
              elapsed="$((end_ts - start_ts))"
              echo "<<< [done] ${label} (${elapsed}s)"
            }
            timed_retry() {
              label="$1"
              max_attempts="$2"
              shift 2
              start_ts="$(date +%s)"
              echo ">>> [start] ${label}"
              retry "${max_attempts}" "$@"
              end_ts="$(date +%s)"
              elapsed="$((end_ts - start_ts))"
              echo "<<< [done] ${label} (${elapsed}s)"
            }
            cd ~/wms
            # Use the job-scoped read token; the ECS GitHub deploy key may be expired.
            # Credential configuration exists only for this command, never in .git/config.
            timed "git_fetch" git -c 'url.https://github.com/.insteadOf=git@github.com:' -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$DEPLOY_GITHUB_TOKEN"; }; f' fetch origin --prune
            unset DEPLOY_GITHUB_TOKEN
            timed "git_checkout_main" git checkout main
            timed "git_reset_deploy_ref" git reset --hard "${DEPLOY_REF}"
            # Persist the WMS company rename before Compose recreates the API.
            timed "update_qlsz_company_config" python3 scripts/wms-update-qilin-company-name.py
            DEPLOY_SESSION_VERSION="$(git rev-parse HEAD)"
            export DEPLOY_SESSION_VERSION
            echo "Using DEPLOY_SESSION_VERSION=${DEPLOY_SESSION_VERSION}"
            timed "git_show_head" git show -s --format="%H %s" HEAD
            if [ -z "${RAKUTEN_RMS_API_ENCRYPTION_KEY:-}" ]; then
              echo "Missing production secret: RAKUTEN_RMS_API_ENCRYPTION_KEY"
              exit 1
            fi
            timed "publish_company_site" sh -c "install -d -m 0755 /var/www/fulangke && find /var/www/fulangke -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && cp -a apps/company-site/. /var/www/fulangke/ && chmod -R a+rX /var/www/fulangke"
            if command -v nginx >/dev/null 2>&1 && [ -e /etc/nginx/sites-enabled/www.fulangke.cn ]; then
              timed "nginx_config_test" nginx -t
              timed "nginx_reload" systemctl reload nginx
            fi
            IMAGE_TAR="/tmp/wms-api-${DEPLOY_REF}.tar.gz"
            IMAGE_TAG="wms-api:${DEPLOY_REF}"
            if [ ! -s "${IMAGE_TAR}" ]; then
              echo "Missing deployment image tar: ${IMAGE_TAR}"
              exit 1
            fi
            timed "resource_check_before_image_load" bash scripts/wms-resource-check.sh
            timed "docker_load_api_image" timeout --kill-after=30s 10m docker load --input "${IMAGE_TAR}"
            {
              printf '%s\n' 'services:'
              printf '%s\n' '  api:'
              printf '    image: %s\n' "${IMAGE_TAG}"
              printf '%s\n' '    build: null'
            } > /tmp/wms-api-image-compose.yml
            timed "show_api_image_compose" cat /tmp/wms-api-image-compose.yml
            timed "ensure_rakuten_tailscale_volume" sh -c "docker volume inspect rakuten_tailscale_state >/dev/null 2>&1 || docker volume create rakuten_tailscale_state"
            if docker container inspect rakuten-tailscale-test >/dev/null 2>&1; then
              timed "remove_rakuten_egress_test_container" docker rm -f rakuten-tailscale-test
            fi
            timed "validate_api_image_compose" docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress config --quiet
            timed_retry "compose_up_db" 3 docker compose up -d db
            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              timed "resource_check_before_migration" bash scripts/wms-resource-check.sh
              OLD_API_IMAGE="$(docker inspect --format '{{.Config.Image}}' wms_api)"
              OLD_API_DEPLOY_VERSION="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' wms_api | sed -n 's/^DEPLOY_SESSION_VERSION=//p')"
              {
                printf '%s\n' 'services:' '  api:'
                printf '    image: %s\n' "$OLD_API_IMAGE"
                printf '%s\n' '    build: null'
              } > /tmp/wms-api-rollback-compose.yml
              timed "company_database_backup_and_restore_verify" bash scripts/wms-company-backup.sh /tmp/wms-company-backup-receipt.env
              . /tmp/wms-company-backup-receipt.env
              if [ "$COMPANY_BACKUP_PENDING" = 1 ]; then COMPANY_ROLLBACK_ENABLED=1; fi
              echo "Running prisma migrate deploy..."
              timed "prisma_migrate_deploy" docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml run --rm --no-deps api timeout -k 30 1200 npm run -w api prisma:migrate:deploy
              timed "company_migration_data_verify" bash scripts/wms-company-verify.sh /tmp/wms-company-backup-receipt.env
            else
              echo "Skipping prisma migrate deploy."
            fi
            timed_retry "compose_up_rakuten_egress" 3 docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress up -d --force-recreate rakuten-egress
            RAKUTEN_EGRESS_READY=0
            for i in $(seq 1 20); do
              if docker exec wms_rakuten_egress tailscale status 2>/dev/null | grep -Eq "${RAKUTEN_RMS_EXIT_NODE_IP}.*exit node"; then
                RAKUTEN_EGRESS_READY=1
                echo "Rakuten Japan egress is ready (attempt ${i})."
                break
              fi
              sleep 2
            done
            if [ "${RAKUTEN_EGRESS_READY}" -ne 1 ]; then
              echo "Rakuten Japan egress did not select the configured exit node."
              docker logs --tail=120 wms_rakuten_egress || true
              exit 1
            fi
            timed "preserve_api_data" bash scripts/wms-preserve-api-data.sh
            timed_retry "compose_up_api_recreate" 3 docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress up -d --force-recreate --remove-orphans api
            timed "compose_ps" docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress ps
            timed "api_logs_tail_120" sh -c "docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress logs --tail=120 api || true"
            echo "Smoke check static assets..."
            READY=0
            SMOKE_START_TS="$(date +%s)"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                READY=1
                echo "API is ready (attempt ${i})."
                break
              fi
              sleep 2
            done
            if [ "${READY}" -ne 1 ]; then
              echo "API readiness check timeout."
              docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress ps
              docker compose -f docker-compose.yml -f /tmp/wms-api-image-compose.yml --profile rakuten-egress logs --tail=200 api || true
              exit 1
            fi
            SMOKE_END_TS="$(date +%s)"
            echo "<<< [done] smoke_wait_ready ($((SMOKE_END_TS - SMOKE_START_TS))s)"
            timed "smoke_head_root" curl -fI http://127.0.0.1:3000/
            timed "smoke_head_app_js" curl -fI http://127.0.0.1:3000/app.js
            if [ -e /etc/nginx/sites-enabled/www.fulangke.cn ]; then
              timed "smoke_company_site" sh -c "curl -fsS --resolve 'www.fulangke.cn:443:127.0.0.1' https://www.fulangke.cn/ | grep -q '乳山市弗朗克贸易有限公司'"
              timed "smoke_privacy_policy" sh -c "curl -fsS --resolve 'www.fulangke.cn:443:127.0.0.1' https://www.fulangke.cn/privacy/ | grep -q '隐私政策'"
            fi
            timed "smoke_download_app_js" curl -fsS http://127.0.0.1:3000/app.js -o /tmp/wms_app.js
            timed "smoke_grep_marker" grep -q "normalizeErrorMessage" /tmp/wms_app.js
            if command -v systemctl >/dev/null 2>&1; then
              timed "install_storage_monitor_units" install -m 0644 deploy/systemd/wms-storage-health.service deploy/systemd/wms-storage-health.timer /etc/systemd/system/
              timed "reload_systemd_units" systemctl daemon-reload
              timed "enable_storage_monitor" systemctl enable --now wms-storage-health.timer
            fi
            timed "verify_xiya_company_sync_readonly" timeout --kill-after=10s 180s docker exec -i wms_api node < scripts/verify-xiya-sync.cjs
            COMPANY_ROLLBACK_ENABLED=0
            timed "cleanup_image_tar" rm -f "${IMAGE_TAR}"
            timed "cleanup_old_wms_images" sh -c "docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v keep='${IMAGE_TAG}' '\$1 ~ /^wms-api:/ && \$1 != keep {print \$2}' | sort -u | xargs -r docker rmi || true"
            JOB_END_TS="$(date +%s)"
            echo "=== Deploy total elapsed: $((JOB_END_TS - JOB_START_TS))s ==="
            echo "Smoke check passed."
