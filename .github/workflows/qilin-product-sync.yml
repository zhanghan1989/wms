name: Production company access audit
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only production permission and fulfillment verification
        required: true
        default: inspect
        type: choice
        options: [inspect]
permissions:
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Prepare read-only audit
        run: |
          set -euo pipefail
          node --check scripts/verify-production-order-search.cjs
          printf 'COMPANY_ACCESS_AUDIT_B64=%s\n' "$(base64 -w0 scripts/verify-production-order-search.cjs)" >> "$GITHUB_ENV"
      - name: Verify production order search isolation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          envs: COMPANY_ACCESS_AUDIT_B64
          script: |
            set -euo pipefail
            printf '%s' "$COMPANY_ACCESS_AUDIT_B64" | base64 -d | timeout --kill-after=10s 840s docker exec -i wms_api node
