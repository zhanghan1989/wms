services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wms_api
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      AUTH_REQUIRE_MFA: ${AUTH_REQUIRE_MFA:-false}
      AUTH_REQUIRE_PASSWORD_ROTATION: ${AUTH_REQUIRE_PASSWORD_ROTATION:-false}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?AUTH_MFA_ENCRYPTION_KEY must be configured in .env}
      DEPLOY_SESSION_VERSION: ${DEPLOY_SESSION_VERSION:-local-dev}
      THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:?THIRD_PARTY_API_KEY must be configured in .env}
      XIYA_EXPORT_URL: ${XIYA_EXPORT_URL:-http://103.236.55.93/api/external/products}
      XIYA_LOGISTICS_EXPORT_URL: ${XIYA_LOGISTICS_EXPORT_URL:-http://103.236.55.93/api/external/logistics/rakuten}
      XIYA_EXPORT_API_KEY: ${XIYA_EXPORT_API_KEY:?XIYA_EXPORT_API_KEY must be configured in .env}
      XIYA_COMPANY_NAME: ${XIYA_COMPANY_NAME:-XYJG}
      UOF_TRACKING_API_URL: ${UOF_TRACKING_API_URL:-http://oms.uofexp.com/webservice/PublicService.asmx/ServiceInterfaceUTF8}
      UOF_TRACKING_APP_TOKEN: ${UOF_TRACKING_APP_TOKEN:?UOF_TRACKING_APP_TOKEN must be configured in .env}
      UOF_TRACKING_APP_KEY: ${UOF_TRACKING_APP_KEY:?UOF_TRACKING_APP_KEY must be configured in .env}
      YAMATO_PRINT_MODE: ${YAMATO_PRINT_MODE:-agent}
      PRINT_AGENT_API_KEY: ${PRINT_AGENT_API_KEY:-}
      BACKUP_DIR: /app/storage/backups
      BACKUP_ZIP_COMPRESSION_LEVEL: ${BACKUP_ZIP_COMPRESSION_LEVEL:-1}
      BACKUP_SQL_ROW_BATCH_SIZE: ${BACKUP_SQL_ROW_BATCH_SIZE:-200}
      AMAZON_SP_API_LWA_CLIENT_ID: ${AMAZON_SP_API_LWA_CLIENT_ID:-}
      AMAZON_SP_API_LWA_CLIENT_SECRET: ${AMAZON_SP_API_LWA_CLIENT_SECRET:-}
      AMAZON_SP_API_APPLICATION_ID: ${AMAZON_SP_API_APPLICATION_ID:-}
      AMAZON_SP_API_OAUTH_REDIRECT_URI: ${AMAZON_SP_API_OAUTH_REDIRECT_URI:-}
      AMAZON_SP_API_OAUTH_RETURN_URL: ${AMAZON_SP_API_OAUTH_RETURN_URL:-/}
      AMAZON_SP_API_OAUTH_DRAFT: ${AMAZON_SP_API_OAUTH_DRAFT:-true}
      AMAZON_SP_API_SELLER_CENTRAL_URL: ${AMAZON_SP_API_SELLER_CENTRAL_URL:-https://sellercentral.amazon.co.jp}
      AMAZON_SP_API_ENCRYPTION_KEY: ${AMAZON_SP_API_ENCRYPTION_KEY:-}
      AMAZON_SP_API_SYNC_CRON: "${AMAZON_SP_API_SYNC_CRON:-0 0 11 * * *}"
      AMAZON_SP_API_SYNC_TIMEZONE: ${AMAZON_SP_API_SYNC_TIMEZONE:-Asia/Shanghai}
      AMAZON_SP_API_SCHEDULED_SYNC_ENABLED: ${AMAZON_SP_API_SCHEDULED_SYNC_ENABLED:-false}
      AMAZON_SP_API_INCLUDE_RECIPIENT: ${AMAZON_SP_API_INCLUDE_RECIPIENT:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backup_data:/app/storage/backups
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: wms_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be configured in .env}
      MYSQL_DATABASE: wms_v1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wms_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  mysql_data:
  backup_data:
