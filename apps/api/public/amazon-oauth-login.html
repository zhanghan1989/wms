<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazon 授权跳转</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: #f4f7f4;
      color: #163024;
    }
    .wrap {
      max-width: 560px;
      margin: 72px auto;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #d9e6dd;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(20, 60, 40, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    p {
      margin: 8px 0;
      line-height: 1.6;
    }
    .muted {
      color: #5f7467;
    }
    .error {
      color: #9d1c1c;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Amazon 授权跳转中</h1>
      <p id="status" class="muted">正在处理中，请不要关闭当前窗口。</p>
      <p id="error" class="error"></p>
    </div>
  </div>
  <script>
    const STORAGE_KEY = "wms_amazon_oauth_context";

    function setStatus(text, isError) {
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      if (status) {
        status.textContent = isError ? "授权跳转失败" : text;
      }
      if (error) {
        error.textContent = isError ? text : "";
      }
    }

    try {
      const params = new URLSearchParams(window.location.search);
      const amazonCallbackUri = String(params.get("amazon_callback_uri") || "").trim();
      const amazonState = String(params.get("amazon_state") || "").trim();
      const contextRaw = localStorage.getItem(STORAGE_KEY);
      const context = contextRaw ? JSON.parse(contextRaw) : null;
      if (!amazonCallbackUri || !amazonState) {
        throw new Error("缺少 Amazon 回调参数，无法继续授权。");
      }
      if (!context || !context.state || !context.redirectUri) {
        throw new Error("本地授权上下文不存在，请回到系统重新发起 Amazon 授权。");
      }
      const redirectUrl = new URL(amazonCallbackUri);
      redirectUrl.searchParams.set("amazon_state", amazonState);
      redirectUrl.searchParams.set("state", String(context.state || ""));
      redirectUrl.searchParams.set("redirect_uri", String(context.redirectUri || ""));
      if (String(context.authorizationVersion || "") === "beta") {
        redirectUrl.searchParams.set("version", "beta");
      }
      setStatus("正在跳回 Amazon 完成授权，请稍候...", false);
      window.location.replace(redirectUrl.toString());
    } catch (error) {
      setStatus(error && error.message ? error.message : "授权跳转失败", true);
    }
  </script>
</body>
</html>
